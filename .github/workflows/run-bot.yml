name: Run Bot

# Se dispara por repository_dispatch desde cron-job.org.
# También puede lanzarse manualmente mediante workflow_dispatch.

on:
  repository_dispatch:
    types: [run-bot]

  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/drodrit/rodritrader

# Evita que dos ejecuciones modifiquen state_rodri.json
# al mismo tiempo.
concurrency:
  group: rodri-trader-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Pull imagen del bot
        run: |
          docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Asegurar que existe state_rodri.json
        run: |
          if [ ! -f state_rodri.json ]; then
            echo '{}' > state_rodri.json
          fi

      - name: Ejecutar el bot (una pasada)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/state_rodri.json:/app/state_rodri.json" \
            -e TELEGRAM_TOKEN="${{ secrets.TELEGRAM_TOKEN }}" \
            -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
            ${{ env.IMAGE_NAME }}:latest

      - name: Commit del estado actualizado (si cambió)
        run: |
          git config user.name "rodri-bot"
          git config user.email "actions@users.noreply.github.com"

          git add state_rodri.json

          if git diff --staged --quiet; then
            echo "No hay cambios en state_rodri.json"
            exit 0
          fi

          git commit -m "Actualizar estado del bot [skip ci]"

          git pull --rebase origin main

          git push origin main